<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Dashboard | Guru Hospital</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold">

                <img src="images/Hospital_Logo.png"
                    width="40">

                Guru Hospital

            </a>

            <a href="index.html"
                class="btn btn-light">

                Home

            </a>

        </div>

    </nav>

    <!-- Dashboard -->

    <section class="container py-5">

        <div class="row">

            <!-- Left Side -->

            <div class="col-lg-5">

                <div class="card shadow-lg p-4">

                    <div class="text-center">

                        <img src="images/Doctor_3.png"
                            class="doctor-profile">

                        <h3 class="mt-3">

                            Doctor Dashboard

                        </h3>

                    </div>

                    <form id="doctorForm">

                        <div class="mb-3">

                            <label class="form-label">

                                Doctor Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="doctorName"
                                placeholder="Enter Doctor Name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Specialization

                            </label>

                            <select
                                class="form-select"
                                id="specialization">

                                <option>General Physician</option>

                                <option>Orthopedic</option>

                                <option>Gynecologist</option>

                                <option>Cardiologist</option>

                                <option>Neurologist</option>

                                <option>Dermatologist</option>

                                <option>Pediatrician</option>

                                <option>ENT Specialist</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Status

                            </label>

                            <select
                                class="form-select"
                                id="status">

                                <option value="Online">

                                    Online

                                </option>

                                <option value="Offline">

                                    Offline

                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Waiting Time

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="waitingTime"
                                placeholder="15"
                                required>

                        </div>

                        <button
                            class="btn btn-primary w-100"
                            type="submit">

                            Save Details

                        </button>

                    </form>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-7 mt-4 mt-lg-0">

                <!-- Live Card -->

                <div class="card shadow p-4">

                    <h3>

                        Live Doctor Details

                    </h3>

                    <hr>

                    <h4 id="liveDoctor">

                        Doctor Name

                    </h4>

                    <p>

                        <strong>Specialization :</strong>

                        <span id="liveSpecialization">

                            -

                        </span>

                    </p>

                    <p>

                        <strong>Status :</strong>

                        <span id="liveStatus">

                            -

                        </span>

                    </p>

                    <p>

                        <strong>Waiting Time :</strong>

                        <span id="liveWaiting">

                            -

                        </span>

                    </p>

                </div>

                <!-- Appointment Count -->

                <div class="card shadow p-4 mt-4">

                    <h3>

                        Appointment Count

                    </h3>

                    <h1
                        class="text-primary"
                        id="appointmentCount">

                        0

                    </h1>

                </div>

                <!-- Notifications -->

                <div class="card shadow p-4 mt-4">

                    <h3>

                        Notifications

                    </h3>

                    <ul
                        class="list-group"
                        id="notificationList">

                        <li class="list-group-item">

                            No Appointments Yet

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </section>

    <script src="js/doctor.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
