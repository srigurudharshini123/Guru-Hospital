<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Dashboard | Guru Hospital</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-success shadow">

        <div class="container">

            <a class="navbar-brand fw-bold">

                <img src="images/Hospital_Logo.png"
                    width="40">

                Guru Hospital

            </a>

            <a href="index.html"
                class="btn btn-light">

                Home

            </a>

        </div>

    </nav>

    <!-- Patient Section -->

    <section class="container py-5">

        <div class="row">

            <!-- Left -->

            <div class="col-lg-4">

                <div class="card shadow-lg p-4">

                    <img src="images/Patient_2.png.jpeg"
                        class="patient-profile mb-3">

                    <h3 class="text-center">

                        Patient Portal

                    </h3>

                    <div class="mb-3">

                        <label>

                            Patient Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="patientName"
                            placeholder="Enter Your Name">

                    </div>

                    <div class="mb-3">

                        <label>

                            Search Doctor

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="searchDoctor"
                            placeholder="Search by Doctor Name">

                    </div>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="onlineFilter">

                        <label class="form-check-label">

                            Show Online Doctors Only

                        </label>

                    </div>

                </div>

            </div>

            <!-- Right -->

            <div class="col-lg-8">

                <div class="row"
                    id="doctorContainer">

                </div>

            </div>

        </div>

    </section>

    <script src="js/patient.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Appointment Success Modal -->

<div class="modal fade"
     id="appointmentModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">

                    Appointment Confirmed

                </h5>

            </div>

            <div class="modal-body">

                <h4 class="text-success">

                    ✅ Booking Successful

                </h4>

                <hr>

                <p id="appointmentMessage"></p>

                <h5 class="text-primary">

                    Remaining Time

                </h5>

                <h2 id="countdownTimer"
                    class="text-danger">

                    00:00

                </h2>

            </div>

            <div class="modal-footer">

                <button class="btn btn-primary"
                        data-bs-dismiss="modal">

                    OK

                </button>

            </div>

        </div>

    </div>

</div>

</body>

</html>
